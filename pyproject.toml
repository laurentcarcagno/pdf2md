[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2md"
version = "0.1.0"
description = "Multi-pass PDF to Markdown converter with paragraph-level traceability mapping"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "pydantic>=2.6",
    "ftfy>=6.3",
    "tqdm>=4.67",
    "python-docx>=1.2",
]

[project.optional-dependencies]
ocr = [
    "rapidocr>=3.10",
    "onnxruntime>=1.31",
    "opencv-python-headless>=4.11",
]
docling = ["docling>=2.140"]
# marker-pdf pins pillow<11, which has no wheel on Python 3.14: see the README.
marker = ["marker-pdf>=2.0"]
all = ["pdf2md[ocr,docling]"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
[project.scripts]
pdf2md = "pdf2md.cli:main"
docx2md = "pdf2md.docx_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_calls = false  # PyMuPDF ships no complete type hints
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
